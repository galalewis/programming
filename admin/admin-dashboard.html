<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم | جلال أكاديمي</title>

  <link rel="icon" type="image/png" href="../assets/images/brand/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/themes.css" />
  <link rel="stylesheet" href="../css/pages/admin.css" />
</head>
<body>

  <div id="authLoading" class="state-block">
    <p>بنتأكد من صلاحياتك...</p>
  </div>

  <div class="admin-shell" id="adminShell" hidden>
    <aside class="admin-sidebar" id="adminSidebar"></aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1 class="admin-topbar__title">أهلاً، <span id="adminName">...</span></h1>
          <p class="admin-topbar__subtitle">نظرة سريعة على المنصة دلوقتي.</p>
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="تبديل الوضع الداكن">
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>

      <div class="admin-stats-grid">
        <div class="admin-stat-card">
          <p class="admin-stat-card__label">إجمالي الطلاب</p>
          <p class="admin-stat-card__value" id="statTotalStudents">—</p>
        </div>
        <div class="admin-stat-card">
          <p class="admin-stat-card__label">طلبات دفع معلّقة</p>
          <p class="admin-stat-card__value" id="statPendingPayments">—</p>
        </div>
        <div class="admin-stat-card">
          <p class="admin-stat-card__label">اشتراكات مفعّلة</p>
          <p class="admin-stat-card__value" id="statApprovedEnrollments">—</p>
        </div>
        <div class="admin-stat-card">
          <p class="admin-stat-card__label">امتحانات اتحلت</p>
          <p class="admin-stat-card__value" id="statTotalExams">—</p>
        </div>
      </div>

      <div class="admin-card">
        <h2 style="margin-bottom:1rem; font-size:1.1rem;">اختصارات سريعة</h2>
        <div class="admin-actions" style="flex-wrap:wrap;">
          <a href="admin-payments.html" class="btn btn--primary btn--sm">راجع طلبات الدفع</a>
          <a href="admin-students.html" class="btn btn--outline btn--sm">شوف الطلاب</a>
          <a href="admin-competitions.html" class="btn btn--outline btn--sm">اعمل مسابقة جديدة</a>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="../js/main.js"></script>
  <script type="module">
    import { requireAdmin } from "../js/admin/admin-common.js";
    import { getAllStudents, getPendingEnrollments } from "../firebase/firebase-firestore.js";
    import { db } from "../firebase/firebase-config.js";
    import { collection, getCountFromServer, query, where } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    requireAdmin(async () => {
      document.getElementById("authLoading").hidden = true;
      document.getElementById("adminShell").hidden = false;

      const [students, pending, approvedCount, examsCount] = await Promise.all([
        getAllStudents(),
        getPendingEnrollments(),
        getCountFromServer(query(collection(db, "enrollments"), where("status", "==", "approved"))),
        getCountFromServer(collection(db, "examResults")),
      ]);

      document.getElementById("statTotalStudents").textContent = students.length;
      document.getElementById("statPendingPayments").textContent = pending.length;
      document.getElementById("statApprovedEnrollments").textContent = approvedCount.data().count;
      document.getElementById("statTotalExams").textContent = examsCount.data().count;
    });
  </script>
</body>
</html>
