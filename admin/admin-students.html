<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الطلاب | لوحة تحكم جلال أكاديمي</title>

  <link rel="icon" type="image/png" href="../assets/images/brand/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/themes.css" />
  <link rel="stylesheet" href="../css/pages/admin.css" />
</head>
<body>

  <div id="authLoading" class="state-block">
    <p>بنتأكد من صلاحياتك...</p>
  </div>

  <div class="admin-shell" id="adminShell" hidden>
    <aside class="admin-sidebar" id="adminSidebar"></aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1 class="admin-topbar__title">الطلاب</h1>
          <p class="admin-topbar__subtitle"><span id="studentsCount">0</span> طالب مسجّل</p>
        </div>
        <input type="search" id="studentSearch" class="admin-search" placeholder="دوّر بالاسم أو الإيميل..." />
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>الاسم</th>
              <th>الإيميل</th>
              <th>التليفون</th>
              <th>المرحلة</th>
              <th>XP</th>
              <th>تاريخ التسجيل</th>
            </tr>
          </thead>
          <tbody id="studentsTableBody"></tbody>
        </table>
      </div>

      <div id="studentsEmpty" class="empty-state" style="margin-top:1.5rem;" hidden>
        <p>مفيش طلاب مسجّلين لسه.</p>
      </div>
    </main>
  </div>

  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/admin/admin-students.js"></script>
</body>
</html>
