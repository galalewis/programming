<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المدفوعات | لوحة تحكم جلال أكاديمي</title>

  <link rel="icon" type="image/png" href="../assets/images/brand/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/themes.css" />
  <link rel="stylesheet" href="../css/pages/admin.css" />
</head>
<body>

  <div id="authLoading" class="state-block">
    <p>بنتأكد من صلاحياتك...</p>
  </div>

  <div class="admin-shell" id="adminShell" hidden>
    <aside class="admin-sidebar" id="adminSidebar"></aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1 class="admin-topbar__title">طلبات الدفع</h1>
          <p class="admin-topbar__subtitle">راجع وفعّل اشتراكات الطلاب بعد ما يبعتوا تأكيد التحويل.</p>
        </div>
      </div>

      <div class="filter-bar" style="justify-content:flex-start; padding:0; margin-bottom:1.5rem;">
        <button class="filter-bar__btn is-active" data-status="pending">معلّقة</button>
        <button class="filter-bar__btn" data-status="approved">مفعّلة</button>
        <button class="filter-bar__btn" data-status="rejected">مرفوضة</button>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>الطالب</th>
              <th>الكورس</th>
              <th>تاريخ الطلب</th>
              <th>الحالة</th>
              <th>الإجراء</th>
            </tr>
          </thead>
          <tbody id="paymentsTableBody"></tbody>
        </table>
      </div>

      <div id="paymentsEmpty" class="empty-state" style="margin-top:1.5rem;" hidden>
        <p>مفيش طلبات في القسم ده دلوقتي.</p>
      </div>
    </main>
  </div>

  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/admin/admin-payments.js"></script>
</body>
</html>
