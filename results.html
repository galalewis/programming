<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نتائجي | جلال أكاديمي</title>
  <meta name="description" content="كل نتائج امتحاناتك في مكان واحد." />

  <link rel="icon" type="image/png" href="assets/images/brand/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/pages/dashboard.css" />
  <link rel="stylesheet" href="css/pages/exam.css" />
</head>
<body>

  <a href="#main-content" class="skip-link">تخطَّ إلى المحتوى الرئيسي</a>

  <header class="site-header" id="siteHeader">
    <nav class="navbar" aria-label="التنقل الرئيسي">
      <a href="index.html" class="navbar__brand" aria-label="جلال أكاديمي - الرئيسية">
        <img src="assets/images/brand/logo.png" alt="جلال أكاديمي" class="navbar__logo" width="40" height="40" />
        <span class="navbar__name">جلال أكاديمي</span>
      </a>

      <button class="navbar__toggle" id="navToggle" aria-label="فتح القائمة" aria-expanded="false" aria-controls="navMenu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <ul class="navbar__menu" id="navMenu">
        <li><a href="dashboard.html" class="navbar__link">لوحتي</a></li>
        <li><a href="profile.html" class="navbar__link">البروفايل</a></li>
        <li><a href="exams.html" class="navbar__link">الامتحانات</a></li>
        <li><a href="results.html" class="navbar__link is-active">النتائج</a></li>
        <li><a href="leaderboard.html" class="navbar__link">لوحة المتصدرين</a></li>
        <li><a href="competitions.html" class="navbar__link">المسابقات</a></li>
      </ul>

      <div class="navbar__actions">
        <button class="theme-toggle" id="themeToggle" aria-label="تبديل الوضع الداكن">
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <button id="logoutBtn" class="btn btn--ghost btn--sm">تسجيل الخروج</button>
      </div>
    </nav>
  </header>

  <main id="main-content">

    <div id="authLoading" class="state-block">
      <p>بنتأكد من تسجيل دخولك...</p>
    </div>

    <div id="resultsPageContent" hidden>
      <section class="page-header" style="text-align:right; padding-right:0; padding-left:0;">
        <span class="section-tag">// النتائج</span>
        <h1 class="page-header__title" style="font-size:1.8rem;">كل نتائجك</h1>
      </section>

      <div id="resultsList" class="results-list"></div>

      <div id="resultsEmpty" class="empty-state" hidden>
        <p>لسه معملتش أي امتحان. نتايجك هتبان هنا أول ما تحل أول امتحان.</p>
        <a href="exams.html" class="btn btn--primary">روح للامتحانات</a>
      </div>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/exams.js"></script>
</body>
</html>
