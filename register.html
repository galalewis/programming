<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إنشاء حساب | جلال أكاديمي</title>
  <meta name="description" content="اعمل حسابك في جلال أكاديمي وابدأ رحلتك في البرمجة." />

  <link rel="icon" type="image/png" href="assets/images/brand/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/themes.css" />
</head>
<body>

  <a href="#main-content" class="skip-link">تخطَّ إلى المحتوى الرئيسي</a>

  <header class="site-header" id="siteHeader">
    <nav class="navbar" aria-label="التنقل الرئيسي">
      <a href="index.html" class="navbar__brand" aria-label="جلال أكاديمي - الرئيسية">
        <img src="assets/images/brand/logo.png" alt="جلال أكاديمي" class="navbar__logo" width="40" height="40" />
        <span class="navbar__name">جلال أكاديمي</span>
      </a>
      <div class="navbar__actions" style="display:flex;">
        <button class="theme-toggle" id="themeToggle" aria-label="تبديل الوضع الداكن">
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </nav>
  </header>

  <main id="main-content">
    <div class="auth-card">
      <span class="section-tag">// إنشاء حساب</span>
      <h1 class="section-title" style="font-size:1.6rem;">ابدأ من هنا</h1>
      <p class="section-subtitle" style="margin-bottom: 1.75rem;">حساب واحد يفتحلك كل الكورسات والامتحانات والتقدم بتاعك.</p>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="registerName">الاسم بالكامل</label>
          <input type="text" id="registerName" name="name" required autocomplete="name" placeholder="اسمك الكامل" />
        </div>

        <div class="form-group">
          <label for="registerEmail">البريد الإلكتروني</label>
          <input type="email" id="registerEmail" name="email" required autocomplete="email" placeholder="example@email.com" />
        </div>

        <div class="form-group">
          <label for="registerPhone">رقم الهاتف</label>
          <input type="tel" id="registerPhone" name="phone" required autocomplete="tel" placeholder="01xxxxxxxxx" dir="ltr" />
          <span class="form-hint">لازم يكون نفس الرقم اللي هتحوّل منه وقت الاشتراك في أي كورس.</span>
        </div>

        <div class="form-group">
          <label for="registerGrade">المرحلة الدراسية</label>
          <select id="registerGrade" name="grade" required>
            <option value="" disabled selected>اختار مرحلتك</option>
            <option value="foundation">تأسيسي</option>
            <option value="first-secondary">أولى ثانوي</option>
            <option value="second-secondary">ثانية ثانوي</option>
            <option value="other">مرحلة تانية</option>
          </select>
        </div>

        <div class="form-group">
          <label for="registerPassword">كلمة المرور</label>
          <input type="password" id="registerPassword" name="password" required autocomplete="new-password" placeholder="••••••••" minlength="6" />
        </div>

        <p class="form-error" id="registerError" role="alert"></p>

        <button type="submit" class="btn btn--primary btn--lg" style="width:100%; margin-top: 0.5rem;">
          إنشاء الحساب
        </button>

        <p class="form-hint" style="text-align:center; margin-top: 1.5rem;">
          عندك حساب بالفعل؟ <a href="login.html" style="color: var(--color-secondary); font-weight:600;">سجّل دخولك</a>
        </p>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer__bottom">
      <p>© 2026 جلال أكاديمي. كل الحقوق محفوظة.</p>
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
